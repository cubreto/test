services:
  neo4j:
    image: neo4j:5.21
    container_name: codegraph-neo4j
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4jtest
      # APOC for utilities, GDS for Louvain community detection (cluster.cypher).
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
